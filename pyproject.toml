[project]
name = "smc"
version = "0.1.0"
description = "花蓮慈濟醫院 FB 粉專留言匯出與風險內容偵測"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.7",
    "openpyxl>=3.1",
    "anthropic>=0.40",
]

[project.scripts]
smc = "smc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 明確列出規則，避免 ruff 版本更新時預設集合漂移
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "PYI", "RUF"]
# 全專案以繁體中文撰寫註解與訊息，全形標點為正確用法而非誤植
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 儲存層一律使用 UTC naive（SQLite 不保存時區，見 fb/models.py），
# 測試中的時間字面值刻意比照此慣例。
"tests/*" = ["DTZ001"]
# scripts/ 為獨立診斷工具，輸出以表格對齊為主，強制斷行反而降低可讀性
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
